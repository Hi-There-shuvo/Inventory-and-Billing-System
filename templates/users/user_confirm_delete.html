{% extends 'base.html' %}
{% block title %}Delete User — SuperShop POS{% endblock %}
{% block page_title %}Delete User{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="form-card text-center">
      <div style="font-size:3rem;margin-bottom:16px;">👤</div>
      <h5 class="fw-bold mb-2">Delete user "{{ user_obj.username }}"?</h5>
      <p class="text-muted mb-4">This action cannot be undone.</p>
      <form method="post">
        {% csrf_token %}
        <div class="d-flex justify-content-center gap-3">
          <button type="submit" class="btn btn-danger" id="confirm-user-delete-btn">
            <i class="bi bi-trash me-1"></i> Yes, Delete
          </button>
          <a href="{% url 'user_list' %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
